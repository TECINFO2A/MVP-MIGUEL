<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('paz-na-escola-theme') === 'dark' ? 'dark' : 'light');</script>
  <title>Criar conta — Paz na Escola</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container auth-container">
    <a href="login.html" class="btn-back">← Voltar ao login</a>
    <header class="auth-header"><div class="brand-mark" aria-hidden="true">+</div><p class="eyebrow">PAZ NA ESCOLA</p><h1 class="page-title">Crie sua conta</h1><p class="page-intro">Tenha um espaço privado para registrar e acompanhar seus relatos.</p></header>
    <main role="main">
      <form id="form-cadastro" class="form-card" novalidate>
        <div id="cadastro-feedback" class="form-feedback" role="alert" hidden></div>
        <div class="form-grid">
          <div class="form-group form-grid-full"><label for="cadastro-nome" class="form-label">Nome completo</label><input id="cadastro-nome" class="form-control" required autocomplete="name"></div>
          <div class="form-group"><label for="cadastro-apelido" class="form-label">Nome de usuário/apelido</label><input id="cadastro-apelido" class="form-control" required autocomplete="nickname"></div>
          <div class="form-group"><label for="cadastro-matricula" class="form-label">Matrícula</label><input id="cadastro-matricula" class="form-control" required inputmode="numeric"></div>
          <div class="form-group form-grid-full"><label for="cadastro-email" class="form-label">E-mail</label><input id="cadastro-email" type="email" class="form-control" required autocomplete="email"></div>
          <div class="form-group"><label for="cadastro-turma" class="form-label">Turma/série</label><input id="cadastro-turma" class="form-control" required placeholder="Ex.: 9º ano A"></div>
          <div class="form-group"><label for="cadastro-senha" class="form-label">Senha</label><input id="cadastro-senha" type="password" class="form-control" required minlength="8" autocomplete="new-password"><small class="field-hint">Use pelo menos 8 caracteres, com letra e número.</small></div>
          <div class="form-group form-grid-full"><label for="cadastro-confirmacao" class="form-label">Confirme sua senha</label><input id="cadastro-confirmacao" type="password" class="form-control" required autocomplete="new-password"></div>
        </div>
        <label class="radio-card identity-card terms-check"><input id="cadastro-termos" type="checkbox" required><span>Li e aceito os termos de uso e a política de privacidade.</span></label>
        <button class="btn btn-primary" type="submit" id="btn-cadastro">Criar minha conta</button>
        <p class="auth-switch">Já tem uma conta? <a href="login.html">Entrar</a></p>
      </form>
    </main>
    <footer class="app-footer"><p>© 2026 Paz na Escola. Seus dados merecem cuidado.</p></footer>
  </div>
  <script src="js/supabase.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script>
</body>
</html>
