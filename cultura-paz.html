<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        const stored = localStorage.getItem('paz-na-escola-theme');
        const theme = stored === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <title>Cultura de Paz — Trilhas de Aprendizagem</title>
  
  <!-- CSS Global -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <a href="index.html" class="btn-back" aria-label="Voltar para a página inicial">
      ← Voltar ao Início
    </a>

    <header role="banner">
      <h1 class="title-main" style="text-align: left; font-size: 1.8rem; margin-bottom: 8px;">Cultura de Paz</h1>
      <p style="color: var(--text-muted); margin-bottom: 24px;">Desenvolva habilidades socioemocionais para lidar com conflitos e construir um ambiente escolar mais amigável.</p>
    </header>

    <main role="main">
      <section aria-label="Trilhas de Aprendizagem" id="trilhas-container">
        <!-- As trilhas serão carregadas dinamicamente via JS (Suporte offline completo) -->
        <div style="text-align: center; padding: 32px; color: var(--text-muted);">
          Carregando trilhas educativas...
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>© 2026 Paz na Escola. Educação e Empatia.</p>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="js/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cultura.js"></script>
</body>
</html>
